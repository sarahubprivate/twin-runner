name: twin-apptest
run-name: ${{ inputs.name }}
# Boots 1-4 TV twin containers on a GitHub arm64 runner (public repo: 4 vCPU; the CPU runs 32-bit ARM natively) and
# runs the twin harness's app test on the given APKs. All images and data are private: twin images on ghcr.io,
# runtime builds in sarahubprivate/twinci (release builds), APKs and reports in sarahubprivate/twinci-data. They are
# reached with the twinci-bot app token (APP_ID, APP_KEY) and DATA_TOKEN (ghcr pulls only). Nothing private is printed to this public log.
on:
  workflow_dispatch:
    inputs:
      apks:
        description: "APK files, space separated, relative to the APK image (all/<file> or arm64/<file>), or a smoke list name: smoke"
        default: smoke
      twins:
        description: "twins on this runner (1-4; 4 vCPU runner: up to 3 at tv_cpus 0.65 + harness 0.25)"
        default: "3"
      apk_release:
        description: "optional: release tag in twinci-data holding the APKs; then apks are file names in it, given as pool/<file>"
        default: ""
      runner:
        description: "runner label"
        default: ubuntu-24.04-arm
      tv_cpus:
        description: "CPU cap of each TV container (N2 is faster than Oracle N1; ~0.65 matches N1 at 1.0)"
        default: "0.65"
      runtime_image:
        description: "optional: tag of ghcr.io/sarahahzub/twinci-rt (oracle: twinci-push.sh runtime <file.sqfs>) to test instead of the snapshot's runtime"
        default: ""
      runtime_asset:
        description: "optional: asset in release builds (atl-build output atl64-*.sqfs or atl32-*.sqfs), sha256-checked, tested instead of the snapshot's runtime.sqfs (atl32-*: runtime32.sqfs)"
        default: ""
      state:
        description: "tag of ghcr.io/sarahahzub/twinci-state: twin volume snapshot (20261030 = twin3, 64-bit manager + atl2-dpad)"
        default: "20261030"
      name:
        description: "report name"
        default: run
      tag:
        description: "image tag on ghcr.io"
        default: "20261030"
      mode:
        description: "apptest (fixed --deep script) or explore (per-app exploration, tarball + contact sheets to twinci-data shots-625 / sheets-625-N)"
        default: apptest
      minutes:
        description: "explore: minutes per app"
        default: "20"
      pointer:
        description: "explore: 1 = pointer-grid clicks on screens where keys give nothing (touch-style apps)"
        default: "0"
      keys:
        description: "explore: key script run after the first screen, e.g. DOWN*2,OK,WAIT5,RIGHT,OK (KEY, KEY*n, WAITn); a non-empty script names the output as a re-run"
        default: ""
      shots_release:
        description: "explore: twinci-data release for the per-app tarballs"
        default: "shots-625"
      agent_hold_minutes:
        description: "agent mode: hold the runner open this many minutes after booting twins (agents drive via Tailscale); 0 = normal harness run"
        default: "0"
permissions:
  contents: read
jobs:
  twin:
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 300
    env:
      R: ghcr.io/sarahahzub
      TAG: ${{ inputs.tag }}
      W: /opt/twinci
      DOCKER_HOST: unix:///var/run/docker.sock
    steps:
      - uses: actions/checkout@v4
      - name: Join tailnet (agents)
        env:
          TS_AUTHKEY: ${{ secrets.TS_AUTHKEY }}
        run: |
          if [ -z "$TS_AUTHKEY" ]; then echo "no TS_AUTHKEY secret, skipping tailnet join"; exit 0; fi
          curl -fsSL https://tailscale.com/install.sh | sh
          sudo tailscale up --authkey="$TS_AUTHKEY" --hostname="gh-twin-${{ github.run_id }}" --accept-routes=false
          sudo tailscale set --ssh=true || true
          echo "tailnet IP: $(tailscale ip -4)"
          tailscale status | head -5
      # data traffic (APKs, runtime images, tarballs, reports) uses the twinci-bot GitHub App, which has its own API
      # quota. DATA_TOKEN (the user's PAT) is only used to pull the private twin images from ghcr.io.
      - name: App token for twinci data
        id: app
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_KEY }}
          owner: sarahubprivate
          repositories: twinci,twinci-data
      - name: Host like the TV
        run: |
          sudo sysctl -w vm.swappiness=70
          if [ "${{ inputs.mode }}" = explore ]; then (sudo apt-get -qq update && sudo DEBIAN_FRONTEND=noninteractive apt-get -qq install -y python3-pil tesseract-ocr fonts-dejavu-core; touch /tmp/apt.done) >/tmp/apt.log 2>&1 & fi
          free -m; nproc; df -h / | tail -1
      - name: Pull images
        env:
          PULL: ${{ secrets.DATA_TOKEN }}
        run: |
          echo "$PULL" | docker login ghcr.io -u sarahahzub --password-stdin >/dev/null
          t0=$(date +%s)
          for p in tv harness builder tree apks; do docker pull -q $R/twinci-$p:$TAG & done
          docker pull -q $R/twinci-state:${{ inputs.state }} &
          [ -n "${{ inputs.runtime_image }}" ] && docker pull -q $R/twinci-rt:${{ inputs.runtime_image }} &
          wait
          echo "pull took $(( $(date +%s) - t0 )) s"
          docker tag $R/twinci-tv:$TAG tvtwin-tv; docker tag $R/twinci-harness:$TAG tvtwin-harness; docker tag $R/twinci-builder:$TAG tvtwin-builder
          sudo mkdir -p $W && sudo chown $USER $W
          for p in tree apks; do id=$(docker create $R/twinci-$p:$TAG /x); docker cp $id:/$p $W/ ; docker rm $id >/dev/null; done
          id=$(docker create $R/twinci-state:${{ inputs.state }} /x); docker cp $id:/state $W/; docker rm $id >/dev/null
          if [ -n "${{ inputs.runtime_image }}" ]; then id=$(docker create $R/twinci-rt:${{ inputs.runtime_image }} /x); docker cp $id:/rt/runtime.sqfs $W/runtime.sqfs; docker rm $id >/dev/null; sha256sum $W/runtime.sqfs; fi
          docker image rm $R/twinci-apks:$TAG $R/twinci-tree:$TAG >/dev/null
          du -sh $W/* 2>/dev/null | sed 's#.*/##' | head -5
      - name: APKs from twinci-data
        if: inputs.apk_release != ''
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          REL: ${{ inputs.apk_release }}
          LIST: ${{ inputs.apks }}
        run: |
          set -euo pipefail
          mkdir -p $W/apks/pool
          files=""
          for a in $LIST; do f=${a#pool/}; [[ "$f" =~ ^[A-Za-z0-9._+-]+\.apk$ ]] || { echo "::error::bad apk name"; exit 1; }; files="$files $f"; done
          GH_TOKEN="$GH_TOKEN" python3 ci/ghrel.py download sarahubprivate/twinci-data "$REL" $W/apks/pool $files
          ls $W/apks/pool | wc -l
      - name: Runtime from release builds
        if: inputs.runtime_asset != ''
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          A: ${{ inputs.runtime_asset }}
          RI: ${{ inputs.runtime_image }}
        run: |
          set -euo pipefail
          [ -z "$RI" ] || { echo "::error::give runtime_image or runtime_asset, not both"; exit 1; }
          [[ "$A" =~ ^[A-Za-z0-9._+-]+\.sqfs$ ]] || { echo "::error::runtime_asset must be an asset name ending in .sqfs: $A"; exit 1; }
          d=$(mktemp -d)
          python3 ci/ghrel.py download sarahubprivate/twinci builds "$d" "$A" "$A.sha256"
          want=$(cut -d' ' -f1 "$d/$A.sha256"); got=$(sha256sum "$d/$A" | cut -d' ' -f1)
          echo "$A: sha256 $got, $A.sha256 says $want, $(stat -c %s "$d/$A") bytes"
          [ "$want" = "$got" ] || { echo "::error::$A does not match its .sha256"; exit 1; }
          mv "$d/$A" $W/runtime.sqfs
      - name: Boot twins
        run: sudo -E bash ci/boot-twins.sh "${{ inputs.twins }}" "${{ inputs.tv_cpus }}" "${{ (inputs.runtime_image != '' || inputs.runtime_asset != '') && '/opt/twinci/runtime.sqfs' || '' }}" "${{ startsWith(inputs.runtime_asset, 'atl32-') && 'runtime32' || 'runtime' }}"
      - name: Hold for agents
        if: inputs.agent_hold_minutes != '0'
        run: |
          echo "agent mode: holding runner ${{ inputs.agent_hold_minutes }} min for agents (tailnet $(tailscale ip -4), host gh-twin-${{ github.run_id }})"
          sleep $(( ${{ inputs.agent_hold_minutes }} * 60 ))
      - name: App test
        if: inputs.mode != 'explore' && inputs.agent_hold_minutes == '0'
        run: sudo -E bash ci/run-apptest.sh "${{ inputs.twins }}" "${{ inputs.name }}" ${{ inputs.apks }}
      - name: Explore
        if: inputs.mode == 'explore' && inputs.agent_hold_minutes == '0'
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          KEYS: ${{ inputs.keys }}
          POINTER: ${{ inputs.pointer }}
          MIN: ${{ inputs.minutes }}
          LIST: ${{ inputs.apks }}
          RUN_NAME: ${{ inputs.name }}
          TWINS: ${{ inputs.twins }}
          SHOTS_RELEASE: ${{ inputs.shots_release }}
        run: |
          [[ "$MIN" =~ ^[0-9]{1,2}(\.[0-9])?$ ]] || { echo "::error::bad minutes"; exit 1; }
          [[ "$KEYS" =~ ^[A-Za-z0-9_*,\ ]*$ ]] || { echo "::error::bad key script"; exit 1; }
          [[ "$RUN_NAME" =~ ^[A-Za-z0-9._-]+$ ]] || { echo "::error::bad name"; exit 1; }
          [[ "$SHOTS_RELEASE" =~ ^[A-Za-z0-9._-]+$ ]] || { echo "::error::bad shots_release"; exit 1; }
          export RERUN_ID=$([ -n "$KEYS" ] && echo "$GITHUB_RUN_ID" || true)
          sudo -E bash ci/run-explore.sh "$TWINS" "$RUN_NAME" "$MIN" $LIST
      - name: Collect
        if: always() && inputs.agent_hold_minutes == '0'
        run: sudo -E bash ci/collect.sh "${{ inputs.twins }}" "${{ inputs.name }}"
      - name: Upload reports to twinci-data (private)
        if: always() && inputs.agent_hold_minutes == '0'
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
        run: |
          f=/tmp/twin-${{ inputs.name }}-${{ github.run_id }}.tar.gz
          sudo tar -C /opt/twinci -czf $f out
          python3 ci/ghrel.py upload sarahubprivate/twinci-data reports $f
          echo "report: $(basename $f)  apps: $(wc -l < /opt/twinci/out/SUMMARY.txt 2>/dev/null || echo 0)"
